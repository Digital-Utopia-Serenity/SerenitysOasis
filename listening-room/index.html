<style>
:root{--pink:#e68ab8;--teal:#66b2b2;--cream:#f5ebe0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:#0c090b;color:var(--cream);line-height:1.65;overflow-x:hidden}
header{background:rgba(12,9,11,.9);backdrop-filter:blur(14px);padding:1.1rem 1.4rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(230,138,184,.22)}
.header-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{font-size:1.05rem;letter-spacing:2px;color:var(--pink);text-decoration:none}
nav{display:flex;gap:.75rem 1.05rem;flex-wrap:wrap}
nav a{color:var(--teal);text-decoration:none;font-size:.9rem;letter-spacing:.5px}
nav a:hover,nav a.active{color:var(--pink)}
main{max-width:720px;margin:0 auto;padding:3.2rem 1.4rem 4rem;text-align:center}
.portrait{width:min(280px,70vw);margin:0 auto 1.4rem;border-radius:16px;overflow:hidden;border:1px solid rgba(230,138,184,.22)}
.portrait img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:top center}
.who{color:var(--teal);font-style:italic;letter-spacing:1px;margin-bottom:.4rem}
h1{font-size:clamp(2rem,5vw,2.8rem);letter-spacing:2px;font-weight:400;margin-bottom:.8rem}
.blurb{color:#e0d0d8;font-size:1.08rem;margin-bottom:1rem}
.soon{display:inline-block;margin:1rem 0 1.6rem;padding:.45rem 1rem;border-radius:999px;border:1px solid rgba(102,178,178,.4);color:var(--teal);letter-spacing:1.5px;font-size:.82rem;text-transform:uppercase}
.links{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.links a{color:var(--cream);text-decoration:none;border:1px solid rgba(230,138,184,.35);padding:.55rem 1rem;border-radius:999px;font-size:.9rem}
.links a:hover{border-color:var(--pink);color:var(--pink)}
footer{text-align:center;padding:2rem 1.2rem;background:#080608;border-top:1px solid rgba(230,138,184,.12);color:#8f7a85;font-size:.9rem}
footer a{color:var(--teal);text-decoration:none;margin:0 .45rem}
footer a:hover{color:var(--pink)}
@media(max-width:680px){.header-inner{flex-direction:column}nav{justify-content:center}}
</style>
</head>
